# Пример конфигурации мостика.
# Скопируйте в config.yaml, подставьте свои данные.
#
# Имя источника (id) = имя RTSP-потока:
#   rtsp://<docker-host>:8554/govorovo  и  rtsp://<docker-host>:8554/lesnaia

outputs:
  rtsp:
    host: mediamtx      # имя сервиса из docker-compose (или IP машины с mediamtx)
    port: 8554

sources:
  # ---------------------------------------------------------------
  # А.М.Видео — 1 шлагбаум (деревня Говорово)(15072)
  # ---------------------------------------------------------------
  - id: govorovo
    type: amvideo
    enabled: true
    login: "79001234567"          # телефон от приложения А.М.Видео
    password: "ВАШ_ПАРОЛЬ"
    id_shlag: 2026                # КПУ (атрибут «ID shlag» у камеры HA);
                                  # можно опустить — тогда берётся первый с камерой
    fps: 5                        # кадров/с на выходе RTSP (для детекции достаточно)
    width: 1280                   # ширина выходного потока (пусто/0 — как есть)

  # ---------------------------------------------------------------
  # ЕГДС — Ул. Лесная · Шлагбаум №1 (Камера №1)
  # Учётные данные КАМЕРЫ (не телефона!) получаются один раз:
  #   python get_egds_camera_creds.py 79001234567
  # ---------------------------------------------------------------
  - id: lesnaia
    type: egds
    enabled: true
    host: rev06.egdsk.ru
    port: 11013
    guid: cb7dcc9a-a855-4b52-927c-aba6e649d397
    login: "ЛОГИН_КАМЕРЫ"
    password: "РАСШИФРОВАННЫЙ_ПАРОЛЬ_КАМЕРЫ"
    framerate: 2                  # сервер отдаёт снимки; 2 кадра/с достаточно
    width: 1280

  # Дополнительные камеры (второй КПУ А.М.Видео, вторая камера ЕГДС и т.д.)
  # добавляются аналогично — по одному блоку с уникальным id.
